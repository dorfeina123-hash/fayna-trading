name: Subscription foundation checks
on:
  pull_request:
  push:
    branches: [development/subscriptions-foundation]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test functions/billing.test.cjs
      - run: node tests/finance-summary.cjs
      - run: node tests/data-export.cjs
