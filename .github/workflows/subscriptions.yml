name: Subscription foundation checks
on:
  pull_request:
  push:
    branches: [development/subscriptions-foundation]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test functions/billing.test.cjs functions/account-policy.test.cjs functions/fx.test.cjs
      - run: node tests/trade-account-entry.cjs
      - run: node --test tests/landing-entry.cjs
      - run: node --test tests/password-login.cjs
      - run: node --test tests/finance-recovery.cjs
      - run: node tests/finance-summary.cjs
      - run: node tests/data-export.cjs
  security-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --prefix tests/security --ignore-scripts
      - run: npx --prefix tests/security firebase emulators:exec --only firestore --project demo-fayna "node --test tests/security/rules.test.cjs"
