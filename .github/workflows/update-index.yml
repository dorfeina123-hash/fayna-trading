name: Validate application (no automatic HTML promotion)
on:
  pull_request:
  push:
    branches: [main, codex/saas-foundation]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-app.cjs
      - run: node tests/saas-dashboard.cjs
      - run: node tests/default-theme.cjs
      - run: node tests/finance-currency.cjs
      - run: node tests/import-atas.cjs
      - run: node tests/chart-symbol.cjs
      - run: node tests/delete-trades.cjs
      - run: node tests/data-export.cjs
      - run: node tests/trade-markers.cjs
  browser-and-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:emulator
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-ui-and-emulator-results
          path: artifacts/
