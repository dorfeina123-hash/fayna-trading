name: Collect market candles
on:
  schedule:
    - cron: '30 22 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: market-data
          path: market-data
      - run: python3 scripts/fetch_candles.py market-data
      - name: Save
        working-directory: market-data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || { git commit -q -m 'Update candles'; git push -q; }
